<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Humisense | Coming Soon</title>
    <style>
        /* Reset some basic styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Arial', sans-serif;
            background-color: white;
            overflow: hidden;
            color: black;
        }

        /* Logo styling */
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 250px; /* Adjust size as needed */
        }

        /* Center the content */
        .content {
            position: relative;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            z-index: 2;
        }

        h1 {
            font-size: 4rem;
            color: #333333;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        .description {
            font-size: 1.5rem;
            color: #666666;
            opacity: 0;
            animation: fadeIn 3s forwards;
            animation-delay: 1s;
        }

        .cta-button {
            font-size: 1.2rem;
            padding: 15px 30px;
            margin-top: 40px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #00aaff, #0099cc);
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.3s ease, background 0.3s ease;
            text-decoration: none;
        }

        .cta-button:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, #0099cc, #00aaff);
        }

        /* Background particle effect */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(0, 170, 255, 0.7);
            opacity: 0;
            animation: particleAnimation 5s infinite;
        }

        /* Particle animation */
        @keyframes particleAnimation {
            0% {
                transform: scale(0);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.2;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        /* Text fade-in animation */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Logo -->
    <img src="logo.png" alt="Humisense Logo" class="logo">
    
    <div class="content">
        <h1>Our Website is Coming Soon!</h1>
        <p class="description">Sorry for the inconvenience but we&rsquo;re performing some maintenance at the moment.</p>
        <p class="description">Click below to contact us, otherwise we&rsquo;ll be back online shortly!</p>
        <a href="mailto:info@humisense.com" class="cta-button">Contact Us</a>
    </div>

    <!-- Particles background -->
    <div class="particles"></div>

    <script>
        function createParticles() {
            for (let i = 0; i < 50; i++) {
                let particle = document.createElement('div');
                particle.classList.add('particle');
                document.querySelector('.particles').appendChild(particle);
                let size = Math.random() * 5 + 5;
                let left = Math.random() * 100;
                let top = Math.random() * 100;
                let animationDuration = Math.random() * 3 + 2;
                let animationDelay = Math.random() * 5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.top = `${top}%`;
                particle.style.animationDuration = `${animationDuration}s`;
                particle.style.animationDelay = `${animationDelay}s`;
            }
        }

        window.onload = function() {
            createParticles();
        };
    </script>
</body>
</html>
